name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # One job, running the same script a developer runs. Keeping the logic in
  # scripts/ci.sh means a green badge and a green laptop mean the same thing.
  check:
    runs-on: ubuntu-24.04
    env:
      # ci.sh treats a missing aarch64 target as a local skip; here it is a
      # failure, so a broken toolchain cannot read as a green check.
      REQUIRE_AARCH64: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: aarch64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2

      # ci.sh cross-BUILDS the aarch64 target. Linking it needs the cross gcc,
      # and building rather than checking is the point: `cargo check` approved
      # inline assembly the assembler rejects, because asm is only parsed at
      # codegen.
      - name: aarch64 cross toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu

      # Everything short of measuring: formatting, lints, tests and the
      # assembly gate. The runner is a shared VM, so its numbers are not worth
      # asserting on; the steps that touch the machine are marked below.
      - name: gates
        run: ./scripts/ci.sh --quick

  measure:
    # A real run, so a regression that only shows up when kernels execute is
    # caught. Not a performance gate: cloud CPU steals time and the spread
    # alone would fail the build for reasons that have nothing to do with the
    # code.
    runs-on: ubuntu-24.04
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: build
        run: cargo build --release

      # Huge pages are the one thing self-test asserts that a shared runner
      # cannot provide: the kernel reserves none, so the hugetlbfs mapping fails
      # and the check correctly reports not-ok and exits non-zero. On real
      # hardware that is a failure worth having; here it is a fact about the
      # VM, so it is printed and explained rather than turned silently green.
      - name: self-test (gated where huge pages exist, reported where they do not)
        run: |
          total=$(awk '/HugePages_Total/{print $2}' /proc/meminfo)
          if [ "${total:-0}" -eq 0 ]; then
            echo "HugePages_Total=0 on this runner, so the huge-page check cannot"
            echo "pass here for reasons that have nothing to do with the code."
            echo "Running self-test and showing the result without gating on it."
            ./target/release/membench self-test || true
          else
            ./target/release/membench self-test
          fi

      - name: one cell, written to JSON
        run: |
          ./target/release/membench run --no-tui --trials 2 --duration-ms 100 \
              --level l1,l2,l3,memory --only read --json ci.json
          # The expected version comes from the crate, not from this file. It
          # used to be hard-coded to 1 here, which meant a deliberate schema
          # bump failed CI in a file nobody thought to look at.
          SCHEMA=$(sed -n 's/^pub const SCHEMA_VERSION: u32 = \(.*\);$/\1/p' \
              crates/membench-core/src/lib.rs)
          python3 - ci.json "$SCHEMA" <<'PY'
          import json, math, sys
          doc = json.load(open(sys.argv[1]))
          assert doc["schema_version"] == int(sys.argv[2]), (doc["schema_version"], sys.argv[2])
          assert doc["cells"], "no cells measured"
          for c in doc["cells"]:
              assert math.isfinite(c["value"]) and c["value"] > 0, c
          print(f"{len(doc['cells'])} cells measured on the runner, schema {doc['schema_version']}")
          PY

      - name: artifact
        uses: actions/upload-artifact@v4
        with:
          name: ci-run
          path: ci.json

[workspace]
resolver = "2"
members = ["crates/membench-core", "crates/membench"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
license = "MIT"
repository = "https://github.com/PhillThomas/membench"
authors = ["Phill Thomas <phill@phillthomas.co.uk>"]

[workspace.dependencies]
anyhow = "1.0"
thiserror = "2.0"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.6", features = ["derive"] }
crossterm = "0.29"
ratatui = "0.30"

# Timing code must never run from a debug build (PLAN.md rule 2); the release
# profile below is what produces trustworthy numbers.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.bench]
inherits = "release"
